[workspace]
resolver = "2"
members = [
    "crates/lop-engine-core",
    "crates/lop-engine-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Seamus James"]
repository = "https://github.com/theseamusjames/lop-engine"
homepage = "https://github.com/theseamusjames/lop-engine"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding cannot cross the WASM boundary anyway — abort keeps the
# binary smaller and failure behavior explicit.
panic = "abort"
strip = true
