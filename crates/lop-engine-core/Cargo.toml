[package]
name = "lop-engine-core"
description = "Pure-Rust image-editing primitives for Lop Engine: blend math, brushes, colour, codecs (PSD, DNG, RAF), filters and selections"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Symlink to the repository LICENSE.md: wasm-pack resolves license-file
# relative to the crate and copies it into pkg/.
license-file = "LICENSE.md"
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }

[dev-dependencies]
jpeg-encoder = "0.6"
jpeg-decoder = "0.3"
