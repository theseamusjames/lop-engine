[package]
name = "lop-engine-wasm"
description = "GPU-first WebGL2 image-editing engine for the browser, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Symlink to the repository LICENSE.md: wasm-pack resolves license-file
# relative to the crate and copies it into pkg/.
license-file = "LICENSE.md"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Rust 1.87+ emits bulk-memory / sign-ext / nontrapping-fptoint by
# default; wasm-opt must be told they are allowed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals"]

[dependencies]
lop-engine-core = { path = "../lop-engine-core", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
swash = "0.1"
skrifa = "0.22"
etagere = "0.2"
brotli = { version = "3", default-features = false, features = ["std"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlActiveInfo",
    "WebGlVertexArrayObject",
    "ImageBitmap",
    "console",
]
